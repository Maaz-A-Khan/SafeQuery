{% extends "base.html" %}
{# Owner: Fouzan. Django's built-in login view; context: form, next #}
{% block title %}Log in · SafeQuery{% endblock %}
{% block content %}
<h1>Log in</h1>
<p>The Log page needs a superuser account.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button>Log in</button></form>
{% endblock %}
